name: Repository Migration Pipeline

on:
  push:
    branches: [ main ]
    paths: [ 'agent.yaml', 'src/**', 'scripts/**' ]
  workflow_dispatch:  # เรียกใช้แมนนวลได้
    inputs:
      session_id:
        description: "Session ID (ถ้ามี)"
        required: false
        type: string

env:
  PYTHON_VERSION: "3.12"
  WORK_DIR: ${{ github.workspace }}
  TMP_DIR: ${{ github.workspace }}/tmp

jobs:
  migrate:
    name: Run Migration
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Clean & Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests
          git lfs install --local

      - name: 🧠 Run Planner
        id: plan
        run: python src/planner.py

      - name: ✅ Run Validator
        id: validate
        env:
          GITHUB_TOKEN: ${{ secrets.MIGRATOR_TOKEN }}
        run: |
          python src/validator.py

      - name: 🚀 Execute Migration
        if: success()
        run: ./scripts/migrate.sh

      - name: 📊 Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: migration-report
          path: report.json
          retention-days: 30
